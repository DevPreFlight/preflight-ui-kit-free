      <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#64748b">METRIC COMPONENT</text>
      
      <rect x="235" y="-2" width="75" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="272" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="11" fill="#2563eb" text-anchor="middle">REACT 19</text>
    </g>

    <!-- Metric Value -->
    <g transform="translate(24, 75)">
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="34" fill="#0f172a" letter-spacing="-1px">$48,290.00</text>
      <rect x="205" y="6" width="105" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="257" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="12" fill="#16a34a" text-anchor="middle">↑ +24.8% MRR</text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="13" fill="#64748b">Verified ARR growth across 12 SaaS projects</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="168" x2="336" y2="168" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Action Buttons Preview -->
    <g transform="translate(24, 188)">
      <rect width="185" height="42" rx="8" fill="#2563eb"/>
      <text x="92" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Copy Component →</text>
      
