    <g transform="translate(265, 0)">
      <rect width="245" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#miniShadow)"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <g transform="translate(24, 25)" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2" fill="#0284c7"/>
      </g>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#0f172a">Tailwind CSS</text>
      <text x="68" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#64748b">Modern Flat White &amp; Blue</text>
    </g>

