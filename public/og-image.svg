        <text x="57" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#1d4ed8" text-anchor="middle">Storybook</text>
