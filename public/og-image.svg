    <g transform="translate(530, 0)">
      <rect width="245" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#miniShadow)"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <g transform="translate(24, 25)" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </g>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#0f172a">TypeScript &amp; AAA</text>
      <text x="68" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#64748b">Zero Any, Full A11y</text>
    </g>

    <!-- Pillar 4: Zero Bloat Copy-Paste -->
    <g transform="translate(795, 0)">
      <rect width="245" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#miniShadow)"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <g transform="translate(24, 25)" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="8" y="8" width="14" height="14" rx="3"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </g>
      <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#0f172a">100% Copy-Paste</text>
      <text x="68" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="12" fill="#64748b">Zero Runtime Bloat</text>
    </g>
