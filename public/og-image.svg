  <g transform="translate(80, 485)">
    <!-- Pillar 1: React 19 & Next.js 15 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#miniShadow)"/>
      <rect x="14" y="15" width="44" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <g transform="translate(14, 15)">
        <ellipse cx="22" cy="22" rx="13" ry="5" fill="none" stroke="#2563eb" stroke-width="1.6" transform="rotate(30 22 22)"/>
        <ellipse cx="22" cy="22" rx="13" ry="5" fill="none" stroke="#2563eb" stroke-width="1.6" transform="rotate(90 22 22)"/>
        <ellipse cx="22" cy="22" rx="13" ry="5" fill="none" stroke="#2563eb" stroke-width="1.6" transform="rotate(150 22 22)"/>
